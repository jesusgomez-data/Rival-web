<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#EF4444">
    <title>Sin conexión — Rival Fit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: radial-gradient(circle at 50% 0%, rgba(239,68,68,0.12), transparent 60%);
        }
        .card {
            max-width: 380px;
            width: 100%;
            text-align: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 40px 28px;
            backdrop-filter: blur(20px);
        }
        .icon {
            width: 72px; height: 72px;
            margin: 0 auto 24px;
            border-radius: 20px;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        h1 span { color: #EF4444; }
        p { color: #9ca3af; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
        button {
            background: #EF4444;
            color: #fff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform .15s ease, box-shadow .15s ease;
            box-shadow: 0 0 24px rgba(239,68,68,0.35);
        }
        button:active { transform: scale(0.97); }
        .status { margin-top: 16px; font-size: 11px; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
        .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-right:6px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.3 } }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Sin <span>conexión</span></h1>
        <p>No hay internet ahora mismo. Tu entrenamiento no se detiene — reconecta para volver a la acción.</p>
        <button onclick="location.reload()">Reintentar</button>
        <div class="status"><span class="dot"></span>Esperando conexión…</div>
    </div>
    <script>
        // Recarga automática cuando vuelve la conexión
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
