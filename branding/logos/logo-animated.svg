<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* R icon draw-in animation */
      @keyframes drawR {
        0%   { opacity: 0; transform: translate(40px, 20px) scale(0.62) scaleY(0); }
        40%  { opacity: 1; transform: translate(40px, 20px) scale(0.62) scaleY(1); }
        100% { opacity: 1; transform: translate(40px, 20px) scale(0.62) scaleY(1); }
      }
      @keyframes fadeSlideUp {
        0%   { opacity: 0; transform: translateY(20px); }
        60%  { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeSlideUpFit {
        0%   { opacity: 0; transform: translateY(16px); }
        75%  { opacity: 0; transform: translateY(16px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.7; }
      }
      .icon-group {
        transform-origin: 200px 140px;
        animation: drawR 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .rival-text {
        animation: fadeSlideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .fit-text {
        animation: fadeSlideUpFit 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .glow-ring {
        animation: pulse 2.5s ease-in-out 1.5s infinite;
      }
    </style>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="200" cy="150" rx="120" ry="80" fill="#EF4444" opacity="0.08" class="glow-ring"/>

  <!-- R Icon animated -->
  <g class="icon-group" style="transform: translate(40px, 20px) scale(0.62);">
    <path d="M160 100H280C360 100 390 160 390 210C390 280 340 310 290 310H220L280 412H360L290 310H300C340 310 420 280 420 190C420 110 360 70 260 70H130L100 442H180L160 100Z" fill="#EF4444"/>
    <path d="M160 100L145 310H220L235 100H160Z" fill="#DC2626"/>
  </g>

  <!-- RIVAL text animated -->
  <text x="200" y="300" fill="#FFFFFF" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="78" letter-spacing="-2" text-anchor="middle" font-style="italic" class="rival-text">RIVAL</text>

  <!-- FIT text animated -->
  <text x="200" y="360" fill="#EF4444" font-family="'Arial Black','Impact',sans-serif" font-weight="900" font-size="42" letter-spacing="18" text-anchor="middle" class="fit-text">FIT</text>
</svg>
